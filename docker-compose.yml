services:
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - venv:/app/.venv
    command: ["uv", "run", "pytest", "-v", "--tb=short"]

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - venv:/app/.venv
    command: ["uv", "run", "pytest", "--cov=src", "--cov-report=term-missing"]

volumes:
  venv:
